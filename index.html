<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="TheStory" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#fadce6" />
    <meta name="description" content="Góc kỷ niệm của Xuân Trung & Phương Dung 💕" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet" />
    <title>The Story 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&family=Dancing+Script:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  </head>
  <body>
    <style>
      #root-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(to bottom right, #fdf2f8, #ffffff, #fce7f3);
        margin: 0;
        padding: 0;
      }
      .loader-content {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: loaderFadeIn 0.5s ease-out;
      }
      .loader-circle {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: rgba(242, 105, 137, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 32px rgba(242, 105, 137, 0.2);
        animation: loaderPulse 1.5s infinite ease-in-out;
      }
      .loader-text {
        margin-top: 24px;
        color: #d94c73;
        font-weight: 600;
        font-family: 'Playfair Display', serif;
        font-size: 1.25rem;
        font-style: italic;
        letter-spacing: 0.05em;
        animation: loaderTextPulse 2s infinite ease-in-out;
      }
      @keyframes loaderFadeIn {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes loaderPulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.2); }
        100% { transform: scale(1); }
      }
      @keyframes loaderTextPulse {
        0% { opacity: 0.6; }
        50% { opacity: 1; }
        100% { opacity: 0.6; }
      }
    </style>
    <div id="root">
      <div id="root-loader">
        <div class="loader-content">
          <div class="loader-circle">
            <span class="material-symbols-outlined" style="font-size: 48px; color: #f26989; font-variation-settings: 'FILL' 1;">favorite</span>
          </div>
          <p class="loader-text">Đang kết nối trái tim...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
